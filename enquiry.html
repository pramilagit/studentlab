<!DOCTYPE html>
<html>
<head>
    <title>Student Enquiry</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }
        .container{
            width:400px;
            margin:80px auto;
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }
        h2{
            text-align:center;
            color:#2c3e50;
        }
        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }
        input[type="submit"]{
            background:#007BFF;
            color:white;
            border:none;
            cursor:pointer;
        }
        input[type="submit"]:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Student Enquiry Form</h2>

<form action="thankyou.html">

<label>Name</label>
<input type="text" name="username" required>

<label>Batch</label>
<input type="text" name="batch" required>

<input type="submit" value="Submit">

</form>

</div>

</body>
</html>
